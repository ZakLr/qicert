[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qicert"
version = "0.1.0.dev0"
description = "Certified quantum-inspired compression for VLAMs: exact bounds, provable pruning, formal safety tails."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ZakLr" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pybind11>=2.12",
]
# PyTorch layers (TTLinear, FamilyAttention) are used only when running real
# experiments; the bench suite and CI smoke tests never import torch, so it
# stays an optional extra to keep clean-env CI cheap.
ml = [
    "torch>=2.9",
]

[tool.setuptools]
packages = ["qicert", "qicert.backbones", "qicert.bench", "qicert.kernels"]

[tool.setuptools.package-dir]
qicert = "python/qicert"
"qicert.backbones" = "python/qicert/backbones"
"qicert.bench" = "bench"

[tool.pytest.ini_options]
testpaths = ["tests"]
