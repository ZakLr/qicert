<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" fill="none" role="img" aria-label="qicert — a smaller robot brain that carries a proof">
  <!-- light paper panel -->
  <rect width="1200" height="240" fill="#e9e6dd"/>
  <rect x="0.5" y="0.5" width="1199" height="239" stroke="#0b1215" stroke-opacity="0.14"/>

  <!-- manifest ruler: top hash tape -->
  <g stroke="#0b1215" stroke-opacity="0.35">
    <line x1="0" y1="14" x2="1200" y2="14" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="24" y1="8" x2="24" y2="20"/>
    <line x1="84" y1="10" x2="84" y2="18"/>
    <line x1="144" y1="8" x2="144" y2="20"/>
    <line x1="204" y1="10" x2="204" y2="18"/>
    <line x1="264" y1="8" x2="264" y2="20"/>
    <line x1="324" y1="10" x2="324" y2="18"/>
    <line x1="384" y1="8" x2="384" y2="20"/>
    <line x1="444" y1="10" x2="444" y2="18"/>
    <line x1="504" y1="8" x2="504" y2="20"/>
    <line x1="564" y1="10" x2="564" y2="18"/>
    <line x1="624" y1="8" x2="624" y2="20"/>
    <line x1="684" y1="10" x2="684" y2="18"/>
    <line x1="744" y1="8" x2="744" y2="20"/>
    <line x1="804" y1="10" x2="804" y2="18"/>
    <line x1="864" y1="8" x2="864" y2="20"/>
    <line x1="924" y1="10" x2="924" y2="18"/>
    <line x1="984" y1="8" x2="984" y2="20"/>
    <line x1="1044" y1="10" x2="1044" y2="18"/>
    <line x1="1104" y1="8" x2="1104" y2="20"/>
    <line x1="1164" y1="10" x2="1164" y2="18"/>
  </g>

  <!-- TT-chain mark, scaled up -->
  <g transform="translate(56,86)">
    <line x1="34" y1="34" x2="54" y2="34" stroke="#0b1215" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <circle cx="44" cy="34" r="2.5" fill="#0b1215" opacity="0.55"/>
    <line x1="88" y1="34" x2="108" y2="34" stroke="#0b1215" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <circle cx="98" cy="34" r="2.5" fill="#0b1215" opacity="0.55"/>

    <rect x="4" y="18" width="30" height="32" rx="9" stroke="#0b1215" stroke-width="3.5"/>
    <line x1="12" y1="27" x2="26" y2="27" stroke="#0b1215" stroke-width="1.8" opacity="0.45"/>
    <line x1="12" y1="34" x2="26" y2="34" stroke="#0b1215" stroke-width="1.8" opacity="0.45"/>
    <line x1="12" y1="41" x2="26" y2="41" stroke="#0b1215" stroke-width="1.8" opacity="0.45"/>

    <rect x="54" y="18" width="30" height="32" rx="9" stroke="#0b1215" stroke-width="3.5"/>
    <line x1="61" y1="41" x2="77" y2="25" stroke="#0b1215" stroke-width="2" opacity="0.5"/>
    <line x1="61" y1="34" x2="73" y2="25" stroke="#0b1215" stroke-width="2" opacity="0.5"/>

    <rect x="108" y="18" width="32" height="32" rx="9" fill="#2ec4b6" fill-opacity="0.14" stroke="#1da99c" stroke-width="3.5"/>
    <path d="M116.5 34.5l4.5 4.5 9-10" stroke="#1da99c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="240" y="122" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="64" letter-spacing="-1.5" fill="#0b1215">qi<tspan fill="#1da99c">cert</tspan></text>

  <!-- tagline -->
  <text x="242" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4c5b64">Certified quantum-inspired compression for vision&#8211;language&#8211;action models.</text>

  <!-- claim chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <rect x="242" y="178" width="140" height="28" rx="14" stroke="#0b1215" stroke-opacity="0.35"/>
    <text x="254" y="197" fill="#0b1215">2.46&#215; smaller</text>
    <rect x="394" y="178" width="176" height="28" rx="14" stroke="#0b1215" stroke-opacity="0.35"/>
    <text x="406" y="197" fill="#0b1215">accuracy at parity</text>
    <rect x="582" y="178" width="168" height="28" rx="14" stroke="#0b1215" stroke-opacity="0.35"/>
    <text x="594" y="197" fill="#1da99c">168/168 certified</text>
  </g>

  <!-- right-side signature equation, framed like an instrument readout -->
  <g>
    <rect x="820" y="92" width="336" height="76" rx="10" fill="#f4f1ea" stroke="#0b1215" stroke-opacity="0.2"/>
    <circle cx="836" cy="104" r="3" fill="#e35d33"/>
    <text x="852" y="124" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#0b1215">&#8214;W&#8214;&#8322; &#8804; &#8711; &#8214;G&#8314;&#8311;&#8323;&#8214;</text>
    <text x="852" y="150" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#6b7a83">exact bound, from the compressed cores</text>
  </g>

  <!-- bottom rule -->
  <line x1="56" y1="222" x2="1144" y2="222" stroke="#0b1215" stroke-opacity="0.15"/>
</svg>
