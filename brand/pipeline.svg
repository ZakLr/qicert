<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" fill="none" role="img" aria-label="qicert pipeline: fine-tune, compress, collapse, repair, certify, guard">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0b1215" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="1000" height="900" fill="#e9e6dd"/>
  <text x="500" y="40" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="3" fill="#6b7a83">THE PIPELINE — EVERY NUMBER MEASURED, NOTHING ASSERTED</text>

  <!-- ═══ step 1 · fine-tune ═══ -->
  <circle cx="150" cy="116" r="18" fill="#0b1215"/>
  <text x="150" y="122" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e9e6dd">1</text>
  <rect x="210" y="70" width="580" height="92" rx="12" fill="#f4f1ea" stroke="#0b1215" stroke-opacity="0.2" stroke-width="2"/>
  <rect x="210" y="70" width="5" height="92" rx="2.5" fill="#0b1215"/>
  <text x="244" y="106" font-family="Georgia, serif" font-weight="bold" font-size="21" fill="#0b1215">Fine-tune</text>
  <text x="244" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">0.5B vision&#8211;language&#8211;action model on a robot-manipulation benchmark</text>
  <text x="244" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">LoRA adapters &#183; 3 independent seeds</text>
  <rect x="806" y="103" width="186" height="26" rx="13" fill="none" stroke="#0b1215" stroke-opacity="0.3"/>
  <text x="899" y="121" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0b1215">acc 0.4319 &#177; 0.0303</text>

  <line x1="500" y1="162" x2="500" y2="200" stroke="#0b1215" stroke-opacity="0.45" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ═══ step 2 · compress ═══ -->
  <circle cx="150" cy="252" r="18" fill="#0b1215"/>
  <text x="150" y="258" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e9e6dd">2</text>
  <rect x="210" y="206" width="580" height="92" rx="12" fill="#f4f1ea" stroke="#0b1215" stroke-opacity="0.2" stroke-width="2"/>
  <rect x="210" y="206" width="5" height="92" rx="2.5" fill="#0b1215"/>
  <text x="244" y="242" font-family="Georgia, serif" font-weight="bold" font-size="21" fill="#0b1215">Compress</text>
  <text x="244" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">every linear layer &#8594; tensor-train cores &#183; activation-aware ranks</text>
  <text x="244" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">ratio counts every hidden byte (adapters, scales) &#8212; no creative accounting</text>
  <rect x="806" y="239" width="186" height="26" rx="13" fill="none" stroke="#0b1215" stroke-opacity="0.3"/>
  <text x="899" y="257" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0b1215">2.46&#215; smaller</text>

  <line x1="500" y1="298" x2="500" y2="336" stroke="#0b1215" stroke-opacity="0.45" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ═══ step 3 · collapse (the honest failure) ═══ -->
  <circle cx="150" cy="388" r="18" fill="#b98212"/>
  <text x="150" y="394" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#fff8ec">3</text>
  <rect x="210" y="342" width="580" height="92" rx="12" fill="#f4f1ea" stroke="#f7b32b" stroke-opacity="0.75" stroke-width="2"/>
  <rect x="210" y="342" width="5" height="92" rx="2.5" fill="#f7b32b"/>
  <text x="244" y="378" font-family="Georgia, serif" font-weight="bold" font-size="21" fill="#0b1215">Collapse &#8212; reported, not hidden</text>
  <text x="244" y="402" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">training-free compression breaks the model: it repeats a single action</text>
  <text x="244" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">(mode collapse &#8212; we publish the exact numeric signature)</text>
  <rect x="806" y="375" width="186" height="26" rx="13" fill="none" stroke="#f7b32b"/>
  <text x="899" y="393" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#b98212">acc 0.1640 &#183; NO-GO</text>

  <line x1="500" y1="434" x2="500" y2="472" stroke="#0b1215" stroke-opacity="0.45" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ═══ step 4 · repair ═══ -->
  <circle cx="150" cy="524" r="18" fill="#e35d33"/>
  <text x="150" y="530" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#fff2ec">4</text>
  <rect x="210" y="478" width="580" height="92" rx="12" fill="#f4f1ea" stroke="#e35d33" stroke-opacity="0.75" stroke-width="2"/>
  <rect x="210" y="478" width="5" height="92" rx="2.5" fill="#e35d33"/>
  <text x="244" y="514" font-family="Georgia, serif" font-weight="bold" font-size="21" fill="#0b1215">Repair</text>
  <text x="244" y="538" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">small adapter &#183; 1,200 training steps &#183; training split only</text>
  <text x="244" y="558" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">a contamination guard verifies and logs that no eval data was touched</text>
  <rect x="806" y="511" width="186" height="26" rx="13" fill="none" stroke="#e35d33"/>
  <text x="899" y="529" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e35d33">acc &#8594; 0.4496 &#177; 0.0137</text>

  <line x1="500" y1="570" x2="500" y2="608" stroke="#0b1215" stroke-opacity="0.45" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ═══ step 5 · certify ═══ -->
  <circle cx="150" cy="660" r="18" fill="#1da99c"/>
  <text x="150" y="666" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#ecfffd">5</text>
  <rect x="210" y="614" width="580" height="92" rx="12" fill="#f4f1ea" stroke="#1da99c" stroke-opacity="0.8" stroke-width="2"/>
  <rect x="210" y="614" width="5" height="92" rx="2.5" fill="#1da99c"/>
  <text x="244" y="650" font-family="Georgia, serif" font-weight="bold" font-size="21" fill="#0b1215">Certify</text>
  <text x="244" y="674" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">exact per-layer Lipschitz bounds &#8212; re-derived from the final merged weights</text>
  <text x="244" y="694" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">machine-checked in Lean 4 &#183; falsified daily by Z3</text>
  <rect x="806" y="647" width="186" height="26" rx="13" fill="none" stroke="#1da99c"/>
  <text x="899" y="665" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1da99c">168/168 layers sound</text>

  <line x1="500" y1="706" x2="500" y2="744" stroke="#0b1215" stroke-opacity="0.45" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ═══ step 6 · guard ═══ -->
  <circle cx="150" cy="796" r="18" fill="#0b1215"/>
  <text x="150" y="802" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e9e6dd">6</text>
  <rect x="210" y="750" width="580" height="92" rx="12" fill="#f4f1ea" stroke="#0b1215" stroke-opacity="0.2" stroke-width="2"/>
  <rect x="210" y="750" width="5" height="92" rx="2.5" fill="#0b1215"/>
  <text x="244" y="786" font-family="Georgia, serif" font-weight="bold" font-size="21" fill="#0b1215">Guard &#8212; at deployment</text>
  <text x="244" y="810" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">runtime bouncer refuses any action outside the certified safety ball</text>
  <text x="244" y="830" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#4c5b64">shadow-syndrome monitor watches the action stream &#183; +0.35 ms/step</text>
  <rect x="806" y="783" width="186" height="26" rx="13" fill="none" stroke="#0b1215" stroke-opacity="0.3"/>
  <text x="899" y="801" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0b1215">demo transcript in repo</text>
</svg>
