<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" fill="none" role="img" aria-label="qicert — a smaller robot brain that carries a proof (dark)">
  <!-- dark panel -->
  <rect width="1200" height="240" fill="#0b1215"/>
  <rect x="0.5" y="0.5" width="1199" height="239" stroke="#f4f1ea" stroke-opacity="0.16"/>

  <!-- manifest ruler: top hash tape -->
  <g stroke="#f4f1ea" stroke-opacity="0.35">
    <line x1="0" y1="14" x2="1200" y2="14" stroke-opacity="0.16" stroke-width="1"/>
    <line x1="24" y1="8" x2="24" y2="20"/>
    <line x1="84" y1="10" x2="84" y2="18"/>
    <line x1="144" y1="8" x2="144" y2="20"/>
    <line x1="204" y1="10" x2="204" y2="18"/>
    <line x1="264" y1="8" x2="264" y2="20"/>
    <line x1="324" y1="10" x2="324" y2="18"/>
    <line x1="384" y1="8" x2="384" y2="20"/>
    <line x1="444" y1="10" x2="444" y2="18"/>
    <line x1="504" y1="8" x2="504" y2="20"/>
    <line x1="564" y1="10" x2="564" y2="18"/>
    <line x1="624" y1="8" x2="624" y2="20"/>
    <line x1="684" y1="10" x2="684" y2="18"/>
    <line x1="744" y1="8" x2="744" y2="20"/>
    <line x1="804" y1="10" x2="804" y2="18"/>
    <line x1="864" y1="8" x2="864" y2="20"/>
    <line x1="924" y1="10" x2="924" y2="18"/>
    <line x1="984" y1="8" x2="984" y2="20"/>
    <line x1="1044" y1="10" x2="1044" y2="18"/>
    <line x1="1104" y1="8" x2="1104" y2="20"/>
    <line x1="1164" y1="10" x2="1164" y2="18"/>
  </g>

  <!-- wordmark: 'qi' light · 'cert' cert-teal -->
  <text x="80" y="126" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="84" letter-spacing="-2" fill="#f4f1ea">qi<tspan fill="#2ec4b6">cert</tspan></text>

  <!-- tagline -->
  <text x="82" y="164" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#8a9ba8">Certified quantum-inspired compression for vision&#8211;language&#8211;action models.</text>

  <!-- claim chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <rect x="82" y="184" width="140" height="28" rx="14" stroke="#f4f1ea" stroke-opacity="0.35"/>
    <text x="94" y="203" fill="#f4f1ea">2.46&#215; smaller</text>
    <rect x="234" y="184" width="176" height="28" rx="14" stroke="#f4f1ea" stroke-opacity="0.35"/>
    <text x="246" y="203" fill="#f4f1ea">accuracy at parity</text>
    <rect x="422" y="184" width="168" height="28" rx="14" stroke="#2ec4b6" stroke-opacity="0.7"/>
    <text x="434" y="203" fill="#2ec4b6">168/168 certified</text>
  </g>

  <!-- right-side signature equation, framed like an instrument readout -->
  <g>
    <rect x="780" y="92" width="376" height="76" rx="10" fill="#131c21" stroke="#f4f1ea" stroke-opacity="0.2"/>
    <circle cx="796" cy="104" r="3" fill="#e35d33"/>
    <text x="812" y="124" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#f4f1ea">&#8214;W&#8214;&#8322; &#8804; &#8711; &#8214;G&#8314;&#8311;&#8323;&#8214;</text>
    <text x="812" y="150" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#8a9ba8">exact bound, from the compressed cores</text>
  </g>

  <!-- bottom rule -->
  <line x1="56" y1="222" x2="1144" y2="222" stroke="#f4f1ea" stroke-opacity="0.15"/>
</svg>
